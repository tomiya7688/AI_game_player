[project]
name = "ai-game-player"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
ocr = ["Pillow", "pytesseract"]
dev = ["ruff==0.15.22", "mypy==2.3.1", "coverage==7.16.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
ai-game-player = "ai_game_player.app:main"

[tool.ruff]
target-version = "py310"

# Existing E701/E702 one-line style findings are tolerated during gradual cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.10"
files = [
  "src/ai_game_player/models.py",
  "src/ai_game_player/safety_guard.py",
  "src/ai_game_player/action_executor.py",
]
strict = true

[tool.coverage.run]
branch = true
source = ["src/ai_game_player"]
data_file = "build/coverage/.coverage"

[tool.coverage.report]
show_missing = true
fail_under = 70.0

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.coverage.html]
directory = "build/coverage/html"