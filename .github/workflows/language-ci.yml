name: language-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-boundary:
    name: Runtime contract / language boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate versioned runtime boundary
        run: python tools/runtime_boundary_check.py

  native-cpp:
    name: C++20 native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Configure native runtime
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native runtime
        run: cmake --build build/native --config Release --parallel
      - name: Test native runtime
        run: ctest --repeat until-fail:5 --test-dir build/native -C Release --output-on-failure
      - name: Measure FFI / IPC / serialization / copy boundary costs
        timeout-minutes: 3
        run: python tools/runtime_boundary_benchmark.py --search-root build/native --output "build/runtime-boundary/${{ matrix.os }}.json" --samples 1000
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-boundary-${{ matrix.os }}
          path: build/runtime-boundary
          if-no-files-found: error

  native-sanitizers:
    name: Native C++ ASan + UBSan + GCC analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure sanitized native tests
        run: cmake -S native -B build/native-sanitized -DCMAKE_BUILD_TYPE=Debug -DKADOKA_ENABLE_SANITIZERS=ON -DKADOKA_ENABLE_GCC_ANALYZER=ON
      - name: Build sanitized native tests
        run: cmake --build build/native-sanitized --parallel
      - name: Run sanitized native tests
        run: ctest --test-dir build/native-sanitized --output-on-failure
      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-sanitizer-diagnostics
          path: build/native-sanitized/Testing/Temporary
          if-no-files-found: warn

  windows-app-bundle:
    name: Windows application bundle + startup smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install application builder
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build complete application bundle
        shell: pwsh
        run: ./tools/build_windows_bundle.ps1
      - name: Smoke-launch built executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "build/app-bundle/dist/Kadoka/Kadoka.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Kadoka.exe startup smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Verify native runtime is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path "build/app-bundle/dist/Kadoka/kadoka_native_runtime.dll")) {
            throw "Native runtime DLL is missing from application bundle"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kadoka-windows-smoke-bundle
          path: build/app-bundle/dist/Kadoka
          if-no-files-found: error

  windows-e2e:
    name: Windows sample loop and 2048 campaign E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run sample-control-confirmed live input loop to milestone
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: python tools/run_windows_e2e.py --steps 24
      - name: Build Native Runtime for Windows Graphics Capture
        shell: pwsh
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) {
            throw "Native Runtime CMake configuration failed with exit code $LASTEXITCODE"
          }
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Native Runtime build failed with exit code $LASTEXITCODE"
          }
          $nativeRuntime = Get-ChildItem -Path build/native -Recurse -Filter kadoka_native_runtime.dll | Select-Object -First 1
          if (-not $nativeRuntime) {
            throw "Native Runtime build completed without producing kadoka_native_runtime.dll"
          }
          "KADOKA_NATIVE_RUNTIME=$($nativeRuntime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Launch the pinned 2048 game in its owned browser window
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          KADOKA_RUN_2048_INTEGRATION: "1"
        run: python -u -X faulthandler -m unittest discover -s tests -p "test_reference_game_2048_launcher.py" -v
      - name: Verify a second live 2048 episode can capture after restart
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          KADOKA_RUN_2048_INTEGRATION: "1"
        run: python -u -X faulthandler -m unittest discover -s tests -p "test_2048_campaign.py" -v
      - name: Run the 600-second pinned-game campaign
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: python -u -X faulthandler tools/run_2048_campaign.py --profile pr --save-failure-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kadoka-windows-e2e-trace
          path: build/e2e
          if-no-files-found: warn

  detect-optional-languages:
    name: Detect optional language sources
    runs-on: ubuntu-latest
    outputs:
      lua: ${{ steps.detect.outputs.lua }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      node: ${{ steps.detect.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: detect
        name: Detect language inputs
        shell: bash
        run: |
          if find . -type f -name '*.lua' -not -path './.git/*' -print -quit | grep -q .; then
            echo "lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "lua=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f \( -name '*.csproj' -o -name '*.sln' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f -name 'package.json' -not -path './.git/*' -print -quit | grep -q .; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  lua:
    name: Lua syntax
    needs: detect-optional-languages
    runs-on: ubuntu-latest
    steps:
      - name: Validate Lua source detection
        env:
          SOURCE_PRESENT: ${{ needs.detect-optional-languages.outputs.lua }}
        run: |
          case "$SOURCE_PRESENT" in
            true) echo "Lua sources detected; syntax checks will run." ;;
            false) echo "No Lua sources detected; no Lua syntax checks apply." ;;
            *) echo "Invalid Lua source detection result." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: needs.detect-optional-languages.outputs.lua == 'true'
        with:
          persist-credentials: false
      - name: Install Lua 5.4
        if: needs.detect-optional-languages.outputs.lua == 'true'
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        if: needs.detect-optional-languages.outputs.lua == 'true'
        shell: bash
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p

  dotnet:
    name: .NET build and test
    needs: detect-optional-languages
    runs-on: windows-latest
    steps:
      - name: Validate .NET source detection
        shell: pwsh
        env:
          SOURCE_PRESENT: ${{ needs.detect-optional-languages.outputs.dotnet }}
        run: |
          if ($env:SOURCE_PRESENT -notin @('true', 'false')) {
            throw 'Invalid .NET source detection result.'
          }
          if ($env:SOURCE_PRESENT -eq 'false') {
            Write-Host 'No .NET project or solution detected; no .NET checks apply.'
          } else {
            Write-Host '.NET sources detected; build and tests will run.'
          }
      - uses: actions/checkout@v4
        if: needs.detect-optional-languages.outputs.dotnet == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: needs.detect-optional-languages.outputs.dotnet == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build and test
        if: needs.detect-optional-languages.outputs.dotnet == 'true'
        shell: pwsh
        run: |
          $target = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $target) {
            $target = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          }
          if (-not $target) { throw 'No .sln or .csproj found after detection.' }
          dotnet restore $target.FullName
          dotnet build $target.FullName --configuration Release --no-restore
          dotnet test $target.FullName --configuration Release --no-build

  node:
    name: JavaScript / TypeScript
    needs: detect-optional-languages
    runs-on: ubuntu-latest
    steps:
      - name: Validate JavaScript / TypeScript source detection
        env:
          SOURCE_PRESENT: ${{ needs.detect-optional-languages.outputs.node }}
        run: |
          case "$SOURCE_PRESENT" in
            true) echo "JavaScript / TypeScript sources detected; package checks will run." ;;
            false) echo "No package.json detected; no JavaScript / TypeScript checks apply." ;;
            *) echo "Invalid JavaScript / TypeScript source detection result." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: needs.detect-optional-languages.outputs.node == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.detect-optional-languages.outputs.node == 'true'
        with:
          node-version: '22'
      - name: Require reproducible dependency lock
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: test -f package-lock.json
      - name: Install dependencies
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm ci
      - name: Test
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm test --if-present
      - name: Typecheck
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm run typecheck --if-present
      - name: Build
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm run build --if-present
