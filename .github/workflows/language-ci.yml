name: language-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-assets:
    name: Provider schema / Reference game source pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema[format]==4.26.0'
      - name: Validate versioned Provider and config schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          format_checker = Draft202012Validator.FORMAT_CHECKER
          assert "uri" in format_checker.checkers, "URI format checker dependency is required"

          schema_paths = [
              Path("schemas/inference_provider/v1/provider_manifest.schema.json"),
              Path("schemas/inference_provider/v1/inference_request.schema.json"),
              Path("schemas/inference_provider/v1/inference_response.schema.json"),
              Path("schemas/inference_provider/v1/health_response.schema.json"),
              Path("schemas/inference_provider/v1/capabilities_response.schema.json"),
              Path("schemas/inference_provider/v1/models_response.schema.json"),
              Path("schemas/inference_provider/v1/cancel_request.schema.json"),
              Path("schemas/inference_provider/v1/cancel_response.schema.json"),
              Path("schemas/config/default_models.schema.json"),
              Path("schemas/config/e2e_reference_games.schema.json"),
          ]
          schemas = {}
          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              schemas[path.as_posix()] = schema
              print(f"SCHEMA OK {path}")

          instances = [
              (
                  Path("config/default_models.json"),
                  schemas["schemas/config/default_models.schema.json"],
              ),
              (
                  Path("config/e2e_reference_games.json"),
                  schemas["schemas/config/e2e_reference_games.schema.json"],
              ),
          ]
          for path, schema in instances:
              instance = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator(schema, format_checker=format_checker).validate(instance)
              print(f"INSTANCE OK {path}")

          def validate_profile_ids(config):
              ids = [profile["id"] for profile in config["profiles"]]
              if len(ids) != len(set(ids)):
                  raise ValueError("model profile IDs must be unique")

          models = json.loads(Path("config/default_models.json").read_text(encoding="utf-8"))
          validate_profile_ids(models)
          duplicate = json.loads(json.dumps(models))
          duplicate["profiles"].append(dict(duplicate["profiles"][0], sha256="0" * 64))
          try:
              validate_profile_ids(duplicate)
          except ValueError:
              pass
          else:
              raise SystemExit("duplicate profile IDs were accepted")

          examples = [
              (
                  Path("schemas/inference_provider/v1/examples/bundled_local_provider.json"),
                  schemas["schemas/inference_provider/v1/provider_manifest.schema.json"],
              ),
              (
                  Path("schemas/inference_provider/v1/examples/local_remote_bridge_provider.json"),
                  schemas["schemas/inference_provider/v1/provider_manifest.schema.json"],
              ),
              (
                  Path("schemas/inference_provider/v1/examples/decision_request.json"),
                  schemas["schemas/inference_provider/v1/inference_request.schema.json"],
              ),
              (
                  Path("schemas/inference_provider/v1/examples/decision_response.json"),
                  schemas["schemas/inference_provider/v1/inference_response.schema.json"],
              ),
          ]
          for path, schema in examples:
              instance = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator(schema, format_checker=format_checker).validate(instance)
              print(f"EXAMPLE OK {path}")

          request = json.loads(Path("schemas/inference_provider/v1/examples/decision_request.json").read_text(encoding="utf-8"))
          request["operation"] = "text_generation"
          request["input"] = {"messages": [{"role": "user", "content": [{"type": "text", "text": "test"}]}]}
          request["constraints"]["response_format"] = {"type": "json_schema", "json_schema": None}
          validator = Draft202012Validator(schemas["schemas/inference_provider/v1/inference_request.schema.json"], format_checker=format_checker)
          if validator.is_valid(request):
              raise SystemExit("json_schema response format must reject null")
          request["constraints"]["response_format"]["json_schema"] = {"type": "object"}
          validator.validate(request)
          print("REQUEST FORMAT OK")

          response = json.loads(Path("schemas/inference_provider/v1/examples/decision_response.json").read_text(encoding="utf-8"))
          response_validator = Draft202012Validator(schemas["schemas/inference_provider/v1/inference_response.schema.json"], format_checker=format_checker)
          response["provider"] = None
          assert not response_validator.is_valid(response), "success must reject null provider"
          response["status"] = "error"
          response.pop("result", None)
          response["error"] = None
          assert not response_validator.is_valid(response), "failure must reject null error"
          response["error"] = {"code": "provider_error", "message": "test", "retryable": False}
          response_validator.validate(response)
          manifest = json.loads(Path("schemas/inference_provider/v1/examples/local_remote_bridge_provider.json").read_text(encoding="utf-8"))
          manifest_validator = Draft202012Validator(schemas["schemas/inference_provider/v1/provider_manifest.schema.json"], format_checker=format_checker)
          manifest["privacy"].pop("declared_data_classes")
          assert not manifest_validator.is_valid(manifest), "remote provider must declare data classes"
          manifest["privacy"]["declared_data_classes"] = []
          assert not manifest_validator.is_valid(manifest), "remote provider must declare at least one data class"
          manifest["privacy"]["declared_data_classes"] = ["decision_context"]
          manifest_validator.validate(manifest)
          print("RESPONSE AND PRIVACY NEGATIVE CASES OK")
          local_manifest = json.loads(Path("schemas/inference_provider/v1/examples/bundled_local_provider.json").read_text(encoding="utf-8"))
          for host in ("127.0.0.1", "[::1]"):
              for port in ("1", "80", "00080", "9999", "10000", "59999", "60000", "64999", "65000", "65499", "65500", "65529", "65530", "65535"):
                  local_manifest["deployment"]["base_url"] = f"http://{host}:{port}"
                  manifest_validator.validate(local_manifest)
              for port in ("0", "00000", "65536", "99999", "100000"):
                  local_manifest["deployment"]["base_url"] = f"http://{host}:{port}"
                  assert not manifest_validator.is_valid(local_manifest), f"invalid endpoint port: {port}"
          print("LOOPBACK PORT BOUNDARIES OK")
          for kind, valid_urls, invalid_urls in (
              ("local_external", ("http://localhost:9000", "http://[::1]:9000/api"), ("not a URI", "http://local host/api", "/relative")),
              ("remote_direct", ("https://example.com", "https://example.com:443/api", "https://[2001:db8::1]/api"), ("https://", "https:///api", "https://:443/api", "https://?query", "https://#fragment", "http://example.com", "https://bad host")),
          ):
              manifest["deployment"]["kind"] = kind
              for endpoint in valid_urls:
                  manifest["deployment"]["base_url"] = endpoint
                  manifest_validator.validate(manifest)
              for endpoint in invalid_urls:
                  manifest["deployment"]["base_url"] = endpoint
                  assert not manifest_validator.is_valid(manifest), f"invalid {kind} endpoint: {endpoint}"
          print("ENDPOINT URI VALIDATION OK")
          PY
      - name: Materialize pinned OSS Reference Game sources
        run: python tools/fetch_ci_games.py --all --clean
      - uses: actions/upload-artifact@v4
        with:
          name: kadoka-reference-game-lock
          path: build/ci-games/manifest-lock.json
          if-no-files-found: error

  runtime-boundary:
    name: Runtime contract / language boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate versioned runtime boundary
        run: python tools/runtime_boundary_check.py

  native-cpp:
    name: C++20 native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Configure native runtime
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native runtime
        run: cmake --build build/native --config Release --parallel
      - name: Test native runtime
        run: ctest --repeat until-fail:5 --test-dir build/native -C Release --output-on-failure
      - name: Measure FFI / IPC / serialization / copy boundary costs
        timeout-minutes: 3
        run: python tools/runtime_boundary_benchmark.py --search-root build/native --output "build/runtime-boundary/${{ matrix.os }}.json" --samples 1000
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-boundary-${{ matrix.os }}
          path: build/runtime-boundary
          if-no-files-found: error

  native-sanitizers:
    name: Native C++ ASan + UBSan + GCC analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure sanitized native tests
        run: cmake -S native -B build/native-sanitized -DCMAKE_BUILD_TYPE=Debug -DKADOKA_ENABLE_SANITIZERS=ON -DKADOKA_ENABLE_GCC_ANALYZER=ON
      - name: Build sanitized native tests
        run: cmake --build build/native-sanitized --parallel
      - name: Run sanitized native tests
        run: ctest --test-dir build/native-sanitized --output-on-failure
      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-sanitizer-diagnostics
          path: build/native-sanitized/Testing/Temporary
          if-no-files-found: warn

  windows-app-bundle:
    name: Windows application bundle + startup smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install application builder
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build complete application bundle
        shell: pwsh
        run: ./tools/build_windows_bundle.ps1
      - name: Smoke-launch built executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "build/app-bundle/dist/Kadoka/Kadoka.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Kadoka.exe startup smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Verify native runtime is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path "build/app-bundle/dist/Kadoka/kadoka_native_runtime.dll")) {
            throw "Native runtime DLL is missing from application bundle"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kadoka-windows-smoke-bundle
          path: build/app-bundle/dist/Kadoka
          if-no-files-found: error

  windows-e2e:
    name: Windows sample loop and 2048 campaign E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run sample-control-confirmed live input loop to milestone
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: python tools/run_windows_e2e.py --steps 24
      - name: Build Native Runtime for Windows Graphics Capture
        shell: pwsh
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) {
            throw "Native Runtime CMake configuration failed with exit code $LASTEXITCODE"
          }
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Native Runtime build failed with exit code $LASTEXITCODE"
          }
          $nativeRuntime = Get-ChildItem -Path build/native -Recurse -Filter kadoka_native_runtime.dll | Select-Object -First 1
          if (-not $nativeRuntime) {
            throw "Native Runtime build completed without producing kadoka_native_runtime.dll"
          }
          "KADOKA_NATIVE_RUNTIME=$($nativeRuntime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Launch the pinned 2048 game in its owned browser window
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          KADOKA_RUN_2048_INTEGRATION: "1"
        run: python -u -X faulthandler -m unittest discover -s tests -p "test_reference_game_2048_launcher.py" -v
      - name: Verify a second live 2048 episode can capture after restart
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          KADOKA_RUN_2048_INTEGRATION: "1"
        run: python -u -X faulthandler -m unittest discover -s tests -p "test_2048_campaign.py" -v
      - name: Install optional post-failure browser diagnostic client
        shell: pwsh
        run: python -m pip install -e ".[browser-validation]"
      - name: Run the 600-second pinned-game campaign
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: python -u -X faulthandler tools/run_2048_campaign.py --profile pr --save-failure-evidence --save-browser-diagnostics --save-heartbeat-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kadoka-windows-e2e-trace
          path: build/e2e
          if-no-files-found: warn

  windows-planning-comparison:
    name: Windows planning comparison (seed ${{ matrix.seed }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        seed: ["479", "480", "481"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install optional comparison OCR and process sampler
        id: comparison_dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[ocr,browser-validation]" psutil==7.1.0
          if ($LASTEXITCODE -ne 0) { throw "Comparison Python dependencies failed" }
          choco install tesseract --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Comparison OCR executable install failed" }
          $ocr = Join-Path $env:ProgramFiles "Tesseract-OCR\tesseract.exe"
          if (-not (Test-Path $ocr)) { throw "Comparison OCR executable missing" }
          "TESSERACT_CMD=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $ocr) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build Native Runtime with owned WGC capture
        id: comparison_native
        shell: pwsh
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "Native configure failed" }
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }
          $runtime = Get-ChildItem build/native -Recurse -Filter kadoka_native_runtime.dll | Select-Object -First 1
          if (-not $runtime) { throw "Native runtime missing" }
          "KADOKA_NATIVE_RUNTIME=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Probe Windows held-reader native rename semantics
        if: ${{ always() && !cancelled() && steps.comparison_dependencies.outcome == 'success' && steps.comparison_native.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: python -u -X faulthandler tools/probe_windows_planning_io.py --output build/planning-comparison/windows/native-file-io-probe.json
      - name: Verify bounded planner slow-memory-Stop worker regressions on Windows
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: |
          python -u -X faulthandler -m unittest discover -s tests -p "test_planning_file_publisher.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Planning atomic-publisher regressions failed" }
          python -u -X faulthandler -m unittest discover -s tests -p "test_planning_file_reader.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Bounded shared-reader regressions failed" }
          python -u -X faulthandler -m unittest discover -s tests -p "test_expectimax_planner.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Bounded planner regressions failed" }
      - name: Repeat bounded worker checkpoint diagnostics (seed 479 only)
        if: matrix.seed == '479'
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: |
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            Write-Host "Windows bounded worker diagnostic attempt $attempt/20"
            python -u -X faulthandler -m unittest discover -s tests -p "test_expectimax_planner.py" -k "test_final_marker_does_not_leave_an_older_checkpoint_adopted" -k "test_reference_play_board_keeps_valid_deeper_checkpoint" -v
            if ($LASTEXITCODE -ne 0) { throw "Bounded worker diagnostic failed at attempt $attempt/20" }
          }
      - name: Diagnose fixed-pixel OCR engine model and segmentation
        if: ${{ always() && !cancelled() && steps.comparison_dependencies.outcome == 'success' && steps.comparison_native.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          COMPARISON_SEED: ${{ matrix.seed }}
        run: |
          python -u tools/probe_windows_planning_score_ocr.py --output "build/planning-comparison/windows/score-ocr-probe-$env:COMPARISON_SEED/report.json"
          if ($LASTEXITCODE -ne 0) { throw "Fixed-pixel OCR diagnostic failed" }
      - name: Diagnose whitelist output and fixed whitespace variants
        if: ${{ always() && !cancelled() && steps.comparison_dependencies.outcome == 'success' && steps.comparison_native.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          COMPARISON_SEED: ${{ matrix.seed }}
        run: |
          python -u tools/probe_windows_planning_score_engine.py --case-id 124944163043-planner-481 --case-id 124944163043-baseline-481 --output "build/planning-comparison/windows/score-engine-probe-$env:COMPARISON_SEED/report.json"
          if ($LASTEXITCODE -ne 0) { throw "Fixed-pixel OCR engine diagnostic failed" }
      - name: Validate same-pixel score OCR fixtures with installed Tesseract
        if: ${{ always() && !cancelled() && steps.comparison_dependencies.outcome == 'success' && steps.comparison_native.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: |
          python -c "import shutil; assert shutil.which('tesseract'), 'Installed comparison Tesseract must be on PATH'"
          if ($LASTEXITCODE -ne 0) { throw "Comparison OCR dependency is unavailable" }
          python -u -X faulthandler -m unittest discover -s tests -p "test_planning_score*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Same-pixel score OCR regressions failed" }
      - name: Compare short owned-window play with identical seed and step budget
        if: ${{ always() && !cancelled() && steps.comparison_dependencies.outcome == 'success' && steps.comparison_native.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: "src;."
          COMPARISON_SEED: ${{ matrix.seed }}
        run: python -u -X faulthandler tools/compare_2048_windows_planning.py --seed $env:COMPARISON_SEED --max-steps 12 --allow-live-input --save-failure-evidence --save-browser-diagnostics --save-heartbeat-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-planning-comparison-${{ matrix.seed }}
          path: build/planning-comparison/windows
          if-no-files-found: error
      - name: Read pinned historical recognition failure artifact (seed 479 only)
        id: known_failure_8dc
        if: ${{ always() && !cancelled() && matrix.seed == '479' && steps.comparison_dependencies.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '41349184700'
          artifact-ids: '13100932060'
          merge-multiple: true
          path: ${{ runner.temp }}/fixed-failure-artifacts/known-8dc
      - name: Read pinned historical control lease failure artifact (seed 479 only)
        id: known_failure_d954
        if: ${{ always() && !cancelled() && matrix.seed == '479' && steps.comparison_dependencies.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '41349710044'
          artifact-ids: '13100474424'
          merge-multiple: true
          path: ${{ runner.temp }}/fixed-failure-artifacts/known-d954
      - name: Export bounded pinned historical game pixels and typed control evidence
        if: ${{ always() && !cancelled() && matrix.seed == '479' && (steps.known_failure_8dc.outcome == 'success' || steps.known_failure_d954.outcome == 'success') }}
        shell: pwsh
        env:
          FIXED_FAILURE_DOWNLOAD_ROOT: ${{ runner.temp }}/fixed-failure-artifacts
        run: |
          python -u tools/export_fixed_failure_artifacts.py --download-root "$env:FIXED_FAILURE_DOWNLOAD_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Pinned failure evidence export rejected" }

  detect-optional-languages:
    name: Detect optional language sources
    runs-on: ubuntu-latest
    outputs:
      lua: ${{ steps.detect.outputs.lua }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      node: ${{ steps.detect.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: detect
        name: Detect language inputs
        shell: bash
        run: |
          if find . -type f -name '*.lua' -not -path './.git/*' -print -quit | grep -q .; then
            echo "lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "lua=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f \( -name '*.csproj' -o -name '*.sln' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f -name 'package.json' -not -path './.git/*' -print -quit | grep -q .; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  lua:
    name: Lua syntax
    needs: detect-optional-languages
    runs-on: ubuntu-latest
    steps:
      - name: Validate Lua source detection
        env:
          SOURCE_PRESENT: ${{ needs.detect-optional-languages.outputs.lua }}
        run: |
          case "$SOURCE_PRESENT" in
            true) echo "Lua sources detected; syntax checks will run." ;;
            false) echo "No Lua sources detected; no Lua syntax checks apply." ;;
            *) echo "Invalid Lua source detection result." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: needs.detect-optional-languages.outputs.lua == 'true'
        with:
          persist-credentials: false
      - name: Install Lua 5.4
        if: needs.detect-optional-languages.outputs.lua == 'true'
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        if: needs.detect-optional-languages.outputs.lua == 'true'
        shell: bash
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p

  dotnet:
    name: .NET build and test
    needs: detect-optional-languages
    runs-on: windows-latest
    steps:
      - name: Validate .NET source detection
        shell: pwsh
        env:
          SOURCE_PRESENT: ${{ needs.detect-optional-languages.outputs.dotnet }}
        run: |
          if ($env:SOURCE_PRESENT -notin @('true', 'false')) {
            throw 'Invalid .NET source detection result.'
          }
          if ($env:SOURCE_PRESENT -eq 'false') {
            Write-Host 'No .NET project or solution detected; no .NET checks apply.'
          } else {
            Write-Host '.NET sources detected; build and tests will run.'
          }
      - uses: actions/checkout@v4
        if: needs.detect-optional-languages.outputs.dotnet == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: needs.detect-optional-languages.outputs.dotnet == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build and test
        if: needs.detect-optional-languages.outputs.dotnet == 'true'
        shell: pwsh
        run: |
          $target = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $target) {
            $target = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          }
          if (-not $target) { throw 'No .sln or .csproj found after detection.' }
          dotnet restore $target.FullName
          dotnet build $target.FullName --configuration Release --no-restore
          dotnet test $target.FullName --configuration Release --no-build

  node:
    name: JavaScript / TypeScript
    needs: detect-optional-languages
    runs-on: ubuntu-latest
    steps:
      - name: Validate JavaScript / TypeScript source detection
        env:
          SOURCE_PRESENT: ${{ needs.detect-optional-languages.outputs.node }}
        run: |
          case "$SOURCE_PRESENT" in
            true) echo "JavaScript / TypeScript sources detected; package checks will run." ;;
            false) echo "No package.json detected; no JavaScript / TypeScript checks apply." ;;
            *) echo "Invalid JavaScript / TypeScript source detection result." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: needs.detect-optional-languages.outputs.node == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.detect-optional-languages.outputs.node == 'true'
        with:
          node-version: '22'
      - name: Require reproducible dependency lock
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: test -f package-lock.json
      - name: Install dependencies
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm ci
      - name: Test
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm test --if-present
      - name: Typecheck
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm run typecheck --if-present
      - name: Build
        if: needs.detect-optional-languages.outputs.node == 'true'
        run: npm run build --if-present
