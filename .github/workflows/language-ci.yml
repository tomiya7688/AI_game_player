name: language-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-assets:
    name: Provider schema / Reference game source pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate versioned Provider and config schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_paths = [
              Path("schemas/inference_provider/v1/provider_manifest.schema.json"),
              Path("schemas/inference_provider/v1/inference_request.schema.json"),
              Path("schemas/inference_provider/v1/inference_response.schema.json"),
              Path("schemas/inference_provider/v1/health_response.schema.json"),
              Path("schemas/inference_provider/v1/capabilities_response.schema.json"),
              Path("schemas/inference_provider/v1/models_response.schema.json"),
              Path("schemas/inference_provider/v1/cancel_request.schema.json"),
              Path("schemas/inference_provider/v1/cancel_response.schema.json"),
              Path("schemas/config/default_models.schema.json"),
              Path("schemas/config/e2e_reference_games.schema.json"),
              Path("schemas/config/noisy_provider_ci.schema.json"),
          ]
          schemas = {}
          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              schemas[path.as_posix()] = schema
              print(f"SCHEMA OK {path}")

          instances = [
              (
                  Path("config/default_models.json"),
                  schemas["schemas/config/default_models.schema.json"],
              ),
              (
                  Path("config/e2e_reference_games.json"),
                  schemas["schemas/config/e2e_reference_games.schema.json"],
              ),
              (
                  Path("config/noisy_provider_ci.json"),
                  schemas["schemas/config/noisy_provider_ci.schema.json"],
              ),
          ]
          for path, schema in instances:
              instance = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator(schema).validate(instance)
              print(f"INSTANCE OK {path}")

          examples = [
              (
                  Path("schemas/inference_provider/v1/examples/bundled_local_provider.json"),
                  schemas["schemas/inference_provider/v1/provider_manifest.schema.json"],
              ),
              (
                  Path("schemas/inference_provider/v1/examples/local_remote_bridge_provider.json"),
                  schemas["schemas/inference_provider/v1/provider_manifest.schema.json"],
              ),
              (
                  Path("schemas/inference_provider/v1/examples/decision_request.json"),
                  schemas["schemas/inference_provider/v1/inference_request.schema.json"],
              ),
              (
                  Path("schemas/inference_provider/v1/examples/decision_response.json"),
                  schemas["schemas/inference_provider/v1/inference_response.schema.json"],
              ),
          ]
          for path, schema in examples:
              instance = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator(schema).validate(instance)
              print(f"EXAMPLE OK {path}")
          PY
      - name: Materialize pinned OSS Reference Game sources
        run: python tools/fetch_ci_games.py --all --clean
      - uses: actions/upload-artifact@v4
        with:
          name: kadoka-reference-game-lock
          path: build/ci-games/manifest-lock.json
          if-no-files-found: error

  native-cpp:
    name: C++20 native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure native runtime
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native runtime
        run: cmake --build build/native --config Release --parallel
      - name: Test native runtime
        run: ctest --test-dir build/native -C Release --output-on-failure

  windows-app-bundle:
    name: Windows application bundle + startup smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install application builder
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build complete application bundle
        shell: pwsh
        run: ./tools/build_windows_bundle.ps1
      - name: Smoke-launch built executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "build/app-bundle/dist/Kadoka/Kadoka.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Kadoka.exe startup smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Verify native runtime is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path "build/app-bundle/dist/Kadoka/kadoka_native_runtime.dll")) {
            throw "Native runtime DLL is missing from application bundle"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kadoka-windows-smoke-bundle
          path: build/app-bundle/dist/Kadoka
          if-no-files-found: error

  windows-e2e:
    name: Windows closed-loop sample E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run capture-recognition-decision-live-input loop to milestone
        shell: pwsh
        env:
          PYTHONPATH: "src;."
        run: python tools/run_windows_e2e.py --steps 24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kadoka-windows-e2e-trace
          path: build/e2e
          if-no-files-found: warn

  detect-optional-languages:
    name: Detect optional language sources
    runs-on: ubuntu-latest
    outputs:
      lua: ${{ steps.detect.outputs.lua }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      node: ${{ steps.detect.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect language inputs
        shell: bash
        run: |
          if find . -type f -name '*.lua' -not -path './.git/*' -print -quit | grep -q .; then
            echo "lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "lua=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f \( -name '*.csproj' -o -name '*.sln' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f -name 'package.json' -not -path './.git/*' -print -quit | grep -q .; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  lua:
    name: Lua syntax
    needs: detect-optional-languages
    if: needs.detect-optional-languages.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        shell: bash
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p

  dotnet:
    name: .NET build and test
    needs: detect-optional-languages
    if: needs.detect-optional-languages.outputs.dotnet == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build and test
        shell: pwsh
        run: |
          $target = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $target) {
            $target = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          }
          if (-not $target) { throw 'No .sln or .csproj found after detection.' }
          dotnet restore $target.FullName
          dotnet build $target.FullName --configuration Release --no-restore
          dotnet test $target.FullName --configuration Release --no-build

  node:
    name: JavaScript / TypeScript
    needs: detect-optional-languages
    if: needs.detect-optional-languages.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require reproducible dependency lock
        run: test -f package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Build
        run: npm run build --if-present
