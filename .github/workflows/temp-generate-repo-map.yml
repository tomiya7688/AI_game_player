name: temporary-generate-repo-map

on:
  push:
    branches:
      - security/bound-safety-log-memory-20261025

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Generate repository map
        run: python tools/generate_docs.py
      - name: Commit generated repository map
        shell: bash
        run: |
          if git diff --quiet -- generated/repo_map.json; then
            echo "repository map already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/repo_map.json
          git commit -m "Update generated repository map"
          git push origin HEAD:security/bound-safety-log-memory-20261025
