name: performance-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-check:
    name: Runtime performance budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            multiplier: "1.0"
          - os: windows-latest
            multiplier: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.14"
      - name: Check CPU hot-path performance budgets
        env:
          PYTHONPATH: src
        run: python tools/performance_check.py --budget-multiplier ${{ matrix.multiplier }}
      - name: Check noisy-provider synthetic performance and safety budgets
        if: always() && steps.setup-python.outcome == 'success'
        env:
          PYTHONPATH: src
        run: python tools/run_noisy_provider_benchmark.py --budget-multiplier ${{ matrix.multiplier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report-${{ matrix.os }}
          path: |
            build/performance/report.json
            build/noisy-provider/report.json
          if-no-files-found: error
