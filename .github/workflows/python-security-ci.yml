name: python-security-ci

# Python Security Profile (Issue #114). Kept separate from the general quality
# gate (#86) so that security findings and lint/type findings stay distinct.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit-profile:
    name: Python security profile (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ./.github/actions/python-trust-floor
      - name: Install pinned security tools
        run: python -m pip install -r tools/python_security_requirements.txt
      - name: Run Bandit and evaluate the profile
        run: python tools/python_security_check.py --run-bandit --output build/python-security/bandit-profile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-bandit-profile
          path: build/python-security/
          if-no-files-found: warn
          overwrite: true

  dependency-audit:
    name: Python dependency audit (pip-audit, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ./.github/actions/python-trust-floor
      - name: Install pinned security tools
        run: python -m pip install -r tools/python_security_requirements.txt
      - name: Install the audited project environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audit-target"
          # The venv's bundled pip may miss the #514 floor; upgrade it with the gated host pip first.
          python -m pip --python "$RUNNER_TEMP/audit-target/bin/python" install --disable-pip-version-check --upgrade -c requirements/python-trust-constraints.txt pip
          python tools/trust_gate.py --python "$RUNNER_TEMP/audit-target/bin/python"
          "$RUNNER_TEMP/audit-target/bin/python" -m pip install -c requirements/python-trust-constraints.txt -e ".[dev,ocr,browser-validation]"
      - name: Audit installed dependencies
        shell: bash
        # pip-audit queries the public vulnerability service. While the audit is advisory (#90),
        # a missing report is a warning on push/pull_request and a failure on scheduled/manual runs.
        run: |
          mkdir -p build/python-security
          status=0
          PIPAPI_PYTHON_LOCATION="$RUNNER_TEMP/audit-target/bin/python" \
            python -I -m pip_audit --skip-editable --progress-spinner off --format json \
            --output build/python-security/pip-audit.json || status=$?
          if [ ! -s build/python-security/pip-audit.json ]; then
            case "$GITHUB_EVENT_NAME" in
              push|pull_request)
                echo "::warning::pip-audit wrote no report (exit $status); dependency audit is unverified"
                exit 0
                ;;
              *)
                echo "::error::pip-audit wrote no report (exit $status)"
                exit 1
                ;;
            esac
          fi
          python tools/python_security_check.py --pip-audit-report build/python-security/pip-audit.json \
            --output build/python-security/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-dependency-audit
          path: build/python-security/
          if-no-files-found: warn
          overwrite: true
