name: resource-stability-ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Resource stability fast gate (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run deterministic leak scenarios and canaries
        shell: pwsh
        env:
          PYTHONPATH: "src"
        run: python tools/run_resource_stability.py run --layer fast --run-profile fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-stability-fast-${{ matrix.os }}
          path: build/resource-stability
          if-no-files-found: error

  deep:
    name: Resource stability deep (windows-latest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run the 10x-step fast gate
        shell: pwsh
        env:
          PYTHONPATH: "src"
        run: python tools/run_resource_stability.py run --layer fast --run-profile deep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-stability-deep
          path: build/resource-stability
          if-no-files-found: error
